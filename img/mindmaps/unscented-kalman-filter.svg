<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 760" preserveAspectRatio="xMidYMid meet"
     role="img" aria-labelledby="t d">
  <title id="t">Unscented Kalman Filter</title>
  <desc id="d">The unscented Kalman filter replaces linearisation with sampling. A set of 2n+1 sigma points is drawn from the previous mean and covariance, propagated through the non-linear motion model, recombined with weights into a predicted mean and covariance, projected into sensor space, and used to form the innovation covariance and the state-measurement cross-covariance from which the Kalman gain is computed. No Jacobians are required.</desc>
  <defs>
  <marker id="m-flow"  markerWidth="9" markerHeight="9" refX="6.5" refY="3"   orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#21503d"/></marker>
  <marker id="m-share" markerWidth="8" markerHeight="8" refX="5.5" refY="2.6" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 Z" fill="#4d8a6a"/></marker>
  <marker id="m-react" markerWidth="8" markerHeight="8" refX="5.5" refY="2.6" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 Z" fill="#8a978c"/></marker>
  <marker id="m-emerg" markerWidth="9" markerHeight="9" refX="6.5" refY="3"   orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#b6803a"/></marker>
  <marker id="m-sup"   markerWidth="8" markerHeight="8" refX="5.5" refY="2.6" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 Z" fill="#2f6b4f"/></marker>
</defs>
  <style>
  .bg   { fill: #fbfaf6 }
  .nd   { fill: #ffffff; stroke: rgba(22,53,42,0.14); stroke-width: 1 }
  .nd.perc   { fill: #eef4f0 }
  .nd.cog    { fill: #f7f3ec }
  .nd.hw     { fill: #eae2d4 }
  .nd.paper  { fill: #f2ece1 }
  .nd.dark   { fill: #16352a; stroke: #16352a }
  .nd.sup    { fill: #f1ece2; stroke: #4d8a6a; stroke-dasharray: 5 4 }
  .nd.mine   { stroke: #2f6b4f; stroke-width: 1.6 }
  .nd.gold   { fill: #f7efe1; stroke: #b6803a }
  .nd.slate  { fill: #eef2f4; stroke: #4a6b7c }
  .panel     { fill: none; stroke: rgba(22,53,42,0.14); stroke-width: 1; stroke-dasharray: 6 5 }
  .panel.solid { stroke-dasharray: none }
  .band      { stroke: rgba(22,53,42,0.05); stroke-width: 1 }
  .band.delib  { fill: rgba(77,138,106,0.05) }
  .band.react  { fill: rgba(47,107,79,0.045) }
  .band.reflex { fill: rgba(182,128,58,0.055) }
  .ttl  { font-family: Fraunces, Georgia, 'Times New Roman', serif; font-weight: 600; fill: #16352a }
  .lbl  { font-family: Fraunces, Georgia, 'Times New Roman', serif; font-weight: 600; fill: #16352a }
  .lbl.on-dark { fill: #fbfaf6 }
  .sub  { font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #5c6f63 }
  .sub.on-dark { fill: #b9d0c3 }
  .col  { font-family: Fraunces, Georgia, 'Times New Roman', serif; font-weight: 600; fill: #2f6b4f }
  .edge { font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #8a978c }
  .edge.gold  { fill: #b6803a; font-weight: 600 }
  .edge.green { fill: #2f6b4f; font-weight: 600 }
  .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #21503d }
  .flow  { stroke: #21503d; stroke-width: 2.2; fill: none; marker-end: url(#m-flow) }
  .share { stroke: #4d8a6a; stroke-width: 1.6; fill: none; marker-start: url(#m-share); marker-end: url(#m-share) }
  .react { stroke: #8a978c; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; marker-end: url(#m-react) }
  .emerg { stroke: #b6803a; stroke-width: 2.6; fill: none; stroke-dasharray: 7 4; marker-end: url(#m-emerg) }
  .super { stroke: #2f6b4f; stroke-width: 1.4; fill: none; stroke-dasharray: 3 4; opacity: .8; marker-start: url(#m-sup); marker-end: url(#m-sup) }
  .thin  { stroke: #4d8a6a; stroke-width: 1.4; fill: none; marker-end: url(#m-share) }
  .dot   { fill: #2f6b4f }
</style>
  <rect width="1060" height="760" class="bg"/>
  <text x="530" y="34" class="ttl" font-size="22" text-anchor="middle">Unscented Kalman Filter</text>
<rect x="40" y="96" width="150" height="86" rx="12" class="nd paper"/><text x="115" y="132.8" class="lbl" font-size="12" text-anchor="middle">Previous state</text><text x="115" y="148.9" class="mono" font-size="12.2" text-anchor="middle" fill="#21503d">x̂<tspan font-size="8.1" baseline-shift="-22%">k−1</tspan> , P<tspan font-size="8.1" baseline-shift="-22%">k−1</tspan></text>
<rect x="240" y="84" width="310" height="110" rx="12" class="nd gold"/><text x="395" y="125.2" class="lbl" font-size="13" text-anchor="middle">Sigma points</text><text x="395" y="142.3" class="mono" font-size="11.2" text-anchor="middle" fill="#21503d">𝒳<tspan font-size="7.4" baseline-shift="-22%">k−1</tspan> = [ x̂ ,  x̂ ± γ√P<tspan font-size="7.4" baseline-shift="-22%">k−1</tspan> ]</text><text x="395" y="159.7" class="mono" font-size="11.2" text-anchor="middle" fill="#21503d">γ = √(n + λ),   λ = α<tspan font-size="7.4" baseline-shift="34%">2</tspan>(n + κ) − n</text>
<path d="M190,139 L240,139" class="flow"/>
<text x="395" y="74" class="col" font-size="11" text-anchor="middle">2n + 1 representative samples</text>
<rect x="610" y="84" width="300" height="110" rx="12" class="nd perc"/><text x="760" y="118.1" class="lbl" font-size="13" text-anchor="middle">Propagate</text><text x="760" y="135.1" class="mono" font-size="10.6" text-anchor="middle" fill="#21503d">𝒳′<tspan font-size="7.0" baseline-shift="-22%">k,i</tspan> = f(𝒳<tspan font-size="7.0" baseline-shift="-22%">k−1,i</tspan> , u<tspan font-size="7.0" baseline-shift="-22%">k</tspan>)</text><text x="760" y="151.4" class="mono" font-size="10.6" text-anchor="middle" fill="#21503d">x̂′<tspan font-size="7.0" baseline-shift="-22%">k</tspan> = Σ W<tspan font-size="7.0" baseline-shift="-22%">i</tspan><tspan font-size="7.0" baseline-shift="34%">(m)</tspan> 𝒳′<tspan font-size="7.0" baseline-shift="-22%">k,i</tspan></text><text x="760" y="167.8" class="mono" font-size="10.6" text-anchor="middle" fill="#21503d">P′<tspan font-size="7.0" baseline-shift="-22%">k</tspan> = Σ W<tspan font-size="7.0" baseline-shift="-22%">i</tspan><tspan font-size="7.0" baseline-shift="34%">(c)</tspan> (𝒳′−x̂′)(𝒳′−x̂′)<tspan font-size="7.0" baseline-shift="34%">T</tspan> + Q<tspan font-size="7.0" baseline-shift="-22%">k</tspan></text>
<path d="M550,139 L610,139" class="flow"/>
<text x="760" y="74" class="col" font-size="11" text-anchor="middle">through the non-linear model</text>
<rect x="610" y="250" width="300" height="96" rx="12" class="nd cog"/><text x="760" y="284.2" class="lbl" font-size="13" text-anchor="middle">Project into sensor space</text><text x="760" y="301.3" class="mono" font-size="11.2" text-anchor="middle" fill="#21503d">𝒵<tspan font-size="7.4" baseline-shift="-22%">k,i</tspan> = h(𝒳′<tspan font-size="7.4" baseline-shift="-22%">k,i</tspan>)</text><text x="760" y="318.7" class="mono" font-size="11.2" text-anchor="middle" fill="#21503d">ẑ<tspan font-size="7.4" baseline-shift="-22%">k</tspan> = Σ W<tspan font-size="7.4" baseline-shift="-22%">i</tspan><tspan font-size="7.4" baseline-shift="34%">(m)</tspan> 𝒵<tspan font-size="7.4" baseline-shift="-22%">k,i</tspan></text>
<path d="M760,194 L760,250" class="flow"/>
<rect x="610" y="402" width="300" height="112" rx="12" class="nd nd"/><text x="760" y="437.0" class="lbl" font-size="12.5" text-anchor="middle">Innovation &amp; cross-covariance</text><text x="760" y="453.3" class="mono" font-size="10.6" text-anchor="middle" fill="#21503d">y<tspan font-size="7.0" baseline-shift="-22%">k</tspan> = z<tspan font-size="7.0" baseline-shift="-22%">k</tspan> − ẑ<tspan font-size="7.0" baseline-shift="-22%">k</tspan></text><text x="760" y="469.7" class="mono" font-size="10.6" text-anchor="middle" fill="#21503d">S<tspan font-size="7.0" baseline-shift="-22%">k</tspan> = Σ W<tspan font-size="7.0" baseline-shift="-22%">i</tspan><tspan font-size="7.0" baseline-shift="34%">(c)</tspan> (𝒵−ẑ)(𝒵−ẑ)<tspan font-size="7.0" baseline-shift="34%">T</tspan> + R<tspan font-size="7.0" baseline-shift="-22%">k</tspan></text><text x="760" y="486.1" class="mono" font-size="10.6" text-anchor="middle" fill="#21503d">P<tspan font-size="7.0" baseline-shift="-22%">xz</tspan> = Σ W<tspan font-size="7.0" baseline-shift="-22%">i</tspan><tspan font-size="7.0" baseline-shift="34%">(c)</tspan> (𝒳′−x̂′)(𝒵−ẑ)<tspan font-size="7.0" baseline-shift="34%">T</tspan></text>
<path d="M760,346 L760,402" class="flow"/>
<rect x="300" y="410" width="230" height="84" rx="12" class="nd nd"/><text x="415" y="446.5" class="lbl" font-size="13" text-anchor="middle">Kalman gain</text><text x="415" y="463.7" class="mono" font-size="11.7" text-anchor="middle" fill="#21503d">K<tspan font-size="7.7" baseline-shift="-22%">k</tspan> = P<tspan font-size="7.7" baseline-shift="-22%">xz</tspan> S<tspan font-size="7.7" baseline-shift="-22%">k</tspan><tspan font-size="7.7" baseline-shift="34%">−1</tspan></text>
<path d="M610,458 L530,458" class="flow"/>
<rect x="40" y="556" width="490" height="92" rx="12" class="nd perc"/><text x="285" y="587.4" class="lbl" font-size="13" text-anchor="middle">Update</text><text x="285" y="604.6" class="mono" font-size="11.7" text-anchor="middle" fill="#21503d">x̂<tspan font-size="7.7" baseline-shift="-22%">k</tspan> = x̂′<tspan font-size="7.7" baseline-shift="-22%">k</tspan> + K<tspan font-size="7.7" baseline-shift="-22%">k</tspan> y<tspan font-size="7.7" baseline-shift="-22%">k</tspan></text><text x="285" y="622.8" class="mono" font-size="11.7" text-anchor="middle" fill="#21503d">P<tspan font-size="7.7" baseline-shift="-22%">k</tspan> = P′<tspan font-size="7.7" baseline-shift="-22%">k</tspan> − K<tspan font-size="7.7" baseline-shift="-22%">k</tspan> S<tspan font-size="7.7" baseline-shift="-22%">k</tspan> K<tspan font-size="7.7" baseline-shift="-22%">k</tspan><tspan font-size="7.7" baseline-shift="34%">T</tspan></text>
<path d="M415,494 L415,556" class="flow"/>
<path d="M40,602 L20,602 L20,139 L40,139" class="react"/>
<text x="96" y="546" class="edge" font-size="9" text-anchor="middle">becomes the previous state</text>
<rect x="934" y="250" width="112" height="264" rx="12" class="nd sup"/><text x="990" y="350.3" class="lbl" font-size="11.5" text-anchor="middle">Weights</text><text x="990" y="365.3" class="mono" font-size="9.6" text-anchor="middle" fill="#21503d">W<tspan font-size="6.3" baseline-shift="-22%">0</tspan><tspan font-size="6.3" baseline-shift="34%">(m)</tspan> = λ/(n+λ)</text><text x="990" y="379.9" class="mono" font-size="9.6" text-anchor="middle" fill="#21503d">W<tspan font-size="6.3" baseline-shift="-22%">0</tspan><tspan font-size="6.3" baseline-shift="34%">(c)</tspan> = W<tspan font-size="6.3" baseline-shift="-22%">0</tspan><tspan font-size="6.3" baseline-shift="34%">(m)</tspan></text><text x="990" y="394.5" class="mono" font-size="9.6" text-anchor="middle" fill="#21503d">+ 1 − α<tspan font-size="6.3" baseline-shift="34%">2</tspan> + β</text><text x="990" y="409.1" class="mono" font-size="9.6" text-anchor="middle" fill="#21503d">W<tspan font-size="6.3" baseline-shift="-22%">i</tspan> = 1 / 2(n+λ)</text><text x="990" y="423.8" class="sub" font-size="8.4" text-anchor="middle">for i = 1 … 2n</text>
<rect x="560" y="556" width="480" height="152" rx="12" class="nd paper"/><text x="572" y="578.8" class="lbl" font-size="12">Why bother</text><text x="572" y="597.2" class="sub" font-size="9.6">The EKF linearises; the UKF samples instead. No Jacobians —</text><text x="572" y="610.8" class="sub" font-size="9.6">which matters when f or h is not differentiable in closed form.</text><text x="572" y="638.1" class="sub" font-size="9.6">α spread of the sigma points (small, e.g. 1e−3)  ·  β prior</text><text x="572" y="651.7" class="sub" font-size="9.6">knowledge of the distribution (2 is optimal for Gaussians)</text><text x="572" y="665.4" class="sub" font-size="9.6">κ secondary scaling  ·  n state dimension  ·  𝒳, 𝒵 sigma points</text>
</svg>
