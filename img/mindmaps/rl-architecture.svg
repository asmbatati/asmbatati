<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 640" preserveAspectRatio="xMidYMid meet"
     role="img" aria-labelledby="t d">
  <title id="t">An RL training stack that stays reproducible</title>
  <desc id="d">A reinforcement-learning training architecture. A configuration file and per-agent action spaces feed a Gymnasium environment. Inside it, an algorithm such as Stable-Baselines3 or Sample Factory passes parameters to the agent's policy network and receives experience tuples from the training loop. Training metrics go to logging and checkpointing, which produces the trained model used by a separate evaluation environment instance.</desc>
  <defs>
  <marker id="m-flow"  markerWidth="9" markerHeight="9" refX="6.5" refY="3"   orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#21503d"/></marker>
  <marker id="m-share" markerWidth="8" markerHeight="8" refX="5.5" refY="2.6" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 Z" fill="#4d8a6a"/></marker>
  <marker id="m-react" markerWidth="8" markerHeight="8" refX="5.5" refY="2.6" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 Z" fill="#8a978c"/></marker>
  <marker id="m-emerg" markerWidth="9" markerHeight="9" refX="6.5" refY="3"   orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#b6803a"/></marker>
  <marker id="m-sup"   markerWidth="8" markerHeight="8" refX="5.5" refY="2.6" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 Z" fill="#2f6b4f"/></marker>
</defs>
  <style>
  .bg   { fill: #fbfaf6 }
  .nd   { fill: #ffffff; stroke: rgba(22,53,42,0.14); stroke-width: 1 }
  .nd.perc   { fill: #eef4f0 }
  .nd.cog    { fill: #f7f3ec }
  .nd.hw     { fill: #eae2d4 }
  .nd.paper  { fill: #f2ece1 }
  .nd.dark   { fill: #16352a; stroke: #16352a }
  .nd.sup    { fill: #f1ece2; stroke: #4d8a6a; stroke-dasharray: 5 4 }
  .nd.mine   { stroke: #2f6b4f; stroke-width: 1.6 }
  .nd.gold   { fill: #f7efe1; stroke: #b6803a }
  .nd.slate  { fill: #eef2f4; stroke: #4a6b7c }
  .panel     { fill: none; stroke: rgba(22,53,42,0.14); stroke-width: 1; stroke-dasharray: 6 5 }
  .panel.solid { stroke-dasharray: none }
  .band      { stroke: rgba(22,53,42,0.05); stroke-width: 1 }
  .band.delib  { fill: rgba(77,138,106,0.05) }
  .band.react  { fill: rgba(47,107,79,0.045) }
  .band.reflex { fill: rgba(182,128,58,0.055) }
  .ttl  { font-family: Fraunces, Georgia, 'Times New Roman', serif; font-weight: 600; fill: #16352a }
  .lbl  { font-family: Fraunces, Georgia, 'Times New Roman', serif; font-weight: 600; fill: #16352a }
  .lbl.on-dark { fill: #fbfaf6 }
  .sub  { font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #5c6f63 }
  .sub.on-dark { fill: #b9d0c3 }
  .col  { font-family: Fraunces, Georgia, 'Times New Roman', serif; font-weight: 600; fill: #2f6b4f }
  .edge { font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #8a978c }
  .edge.gold  { fill: #b6803a; font-weight: 600 }
  .edge.green { fill: #2f6b4f; font-weight: 600 }
  .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #21503d }
  .flow  { stroke: #21503d; stroke-width: 2.2; fill: none; marker-end: url(#m-flow) }
  .share { stroke: #4d8a6a; stroke-width: 1.6; fill: none; marker-start: url(#m-share); marker-end: url(#m-share) }
  .react { stroke: #8a978c; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; marker-end: url(#m-react) }
  .emerg { stroke: #b6803a; stroke-width: 2.6; fill: none; stroke-dasharray: 7 4; marker-end: url(#m-emerg) }
  .super { stroke: #2f6b4f; stroke-width: 1.4; fill: none; stroke-dasharray: 3 4; opacity: .8; marker-start: url(#m-sup); marker-end: url(#m-sup) }
  .thin  { stroke: #4d8a6a; stroke-width: 1.4; fill: none; marker-end: url(#m-share) }
  .dot   { fill: #2f6b4f }
</style>
  <rect width="1160" height="640" class="bg"/>
  <text x="580" y="34" class="ttl" font-size="22" text-anchor="middle">An RL training stack that stays reproducible</text>
<rect x="40" y="96" width="240" height="82" rx="12" class="nd gold mine"/><circle cx="269" cy="107" r="3.5" class="dot"/><text x="160" y="127.7" class="lbl" font-size="13" text-anchor="middle">Configuration</text><text x="160" y="144.7" class="sub" font-size="9.5" text-anchor="middle">YAML / JSON — one file</text><text x="160" y="157.6" class="sub" font-size="9.5" text-anchor="middle">that reproduces the run</text>
<rect x="880" y="96" width="240" height="82" rx="12" class="nd gold"/><text x="1000" y="134.2" class="lbl" font-size="13" text-anchor="middle">Action spaces</text><text x="1000" y="151.2" class="sub" font-size="9.5" text-anchor="middle">per-agent definitions</text>
<text x="580" y="122" class="edge" font-size="10.5" text-anchor="middle">environment · hyper-parameters · training · evaluation</text>
<path d="M160,178 L160,214 L580,214" class="thin"/>
<path d="M1000,178 L1000,214 L580,214" class="thin"/>
<rect x="40" y="250" width="1080" height="280" rx="14" class="panel solid"/><rect x="56" y="241.36" width="163.04000000000002" height="17.4" fill="#fbfaf6"/><text x="63" y="254.32" class="col" font-size="12">Environment (Gymnasium)</text>
<rect x="76" y="322" width="200" height="104" rx="12" class="nd perc mine"/><circle cx="265" cy="333" r="3.5" class="dot"/><text x="176" y="371.2" class="lbl" font-size="13" text-anchor="middle">Agent</text><text x="176" y="388.2" class="sub" font-size="9.5" text-anchor="middle">policy network</text>
<rect x="344" y="322" width="210" height="104" rx="12" class="nd cog"/><text x="449" y="364.7" class="lbl" font-size="13" text-anchor="middle">Algorithm</text><text x="449" y="381.7" class="sub" font-size="9.5" text-anchor="middle">Stable-Baselines3</text><text x="449" y="394.6" class="sub" font-size="9.5" text-anchor="middle">or Sample Factory</text>
<rect x="622" y="322" width="190" height="104" rx="12" class="nd perc"/><text x="717" y="371.2" class="lbl" font-size="13" text-anchor="middle">Training loop</text><text x="717" y="388.2" class="sub" font-size="9.5" text-anchor="middle">rollouts · updates</text>
<rect x="880" y="300" width="200" height="78" rx="12" class="nd nd mine"/><circle cx="1069" cy="311" r="3.5" class="dot"/><text x="980" y="336.2" class="lbl" font-size="11.5" text-anchor="middle">Logging &amp; checkpoints</text><text x="980" y="351.3" class="sub" font-size="8.8" text-anchor="middle">what makes a run repeatable</text>
<rect x="880" y="404" width="200" height="74" rx="12" class="nd paper"/><text x="980" y="438.2" class="lbl" font-size="12.5" text-anchor="middle">Evaluation</text><text x="980" y="454.6" class="sub" font-size="9.2" text-anchor="middle">fresh env instance</text>
<path d="M344,362 L276,362" class="flow"/>
<text x="310" y="352" class="edge" font-size="9" text-anchor="middle">parameters</text>
<path d="M622,362 L554,362" class="flow"/>
<text x="588" y="344" class="edge" font-size="9" text-anchor="middle">experience</text>
<text x="588" y="356" class="edge" font-size="8.6" text-anchor="middle">(s, a, r, s′, done)</text>
<path d="M812,352 L880,336" class="flow"/>
<text x="846" y="328" class="edge" font-size="9" text-anchor="middle">metrics</text>
<path d="M980,378 L980,404" class="thin"/>
<text x="1024" y="396" class="edge" font-size="9" text-anchor="start">trained model</text>
<path d="M176,426 L176,470 L717,470 L717,426" class="react"/>
<text x="446" y="484" class="edge" font-size="9.5" text-anchor="middle">the agent instance the loop actually steps</text>
<path d="M449,426 L449,452 L880,452" class="share"/>
<text x="680" y="444" class="edge" font-size="9.5" text-anchor="middle">model parameters</text>
<text x="580" y="574" class="edge" font-size="11.5" text-anchor="middle">Two boxes carry the whole claim to reproducibility: the config that nothing bypasses, and the checkpoint that says which weights produced which number.</text>
<text x="580" y="596" class="edge" font-size="11.5" text-anchor="middle">Stable-Baselines3 for simplicity, Sample Factory when throughput is the constraint — the rest of the diagram does not change.</text>
</svg>
