<rect x="64" y="116" width="222" height="84" rx="12" class="nd  mine"/><circle cx="275" cy="127" r="3.5" class="dot"/><text x="175" y="148.3" class="lbl" font-size="13" text-anchor="middle">Semantic Perception</text><text x="175" y="165.4" class="sub" font-size="9.8" text-anchor="middle">Detection · segmentation</text><text x="175" y="178.7" class="sub" font-size="9.8" text-anchor="middle">scene understanding</text>
