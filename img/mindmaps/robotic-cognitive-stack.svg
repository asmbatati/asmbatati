<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 682" preserveAspectRatio="xMidYMid meet"
     role="img" aria-labelledby="t d">
  <title id="t">The Robotic Cognitive Stack</title>
  <desc id="d">A closed-loop autonomous-robot architecture. Perception ascends on the left from sensors through state estimation, spatial perception and semantic perception. Decision and control descend on the right from task planning through motion planning to real-time control and the actuators. Both columns exchange data with a shared world model at the centre, a supervisory and monitoring system watches the three decision layers, and everything is grouped into three timing bands: deliberative at 0.1 to 10 hertz, reactive at 10 to 50 hertz, and reflex at 100 hertz to 1 kilohertz.</desc>
  <defs>
  <marker id="m-flow"  markerWidth="9" markerHeight="9" refX="6.5" refY="3"   orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#21503d"/></marker>
  <marker id="m-share" markerWidth="8" markerHeight="8" refX="5.5" refY="2.6" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 Z" fill="#4d8a6a"/></marker>
  <marker id="m-react" markerWidth="8" markerHeight="8" refX="5.5" refY="2.6" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 Z" fill="#8a978c"/></marker>
  <marker id="m-emerg" markerWidth="9" markerHeight="9" refX="6.5" refY="3"   orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#b6803a"/></marker>
  <marker id="m-sup"   markerWidth="8" markerHeight="8" refX="5.5" refY="2.6" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 Z" fill="#2f6b4f"/></marker>
</defs>
  <style>
