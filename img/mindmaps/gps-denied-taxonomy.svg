<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 590" preserveAspectRatio="xMidYMid meet"
     role="img" aria-labelledby="t d">
  <title id="t">Outdoor GPS-denied localization, mapped</title>
  <desc id="d">A taxonomy of outdoor GPS-denied UAV localization. It splits into absolute localization, which covers satellite navigation, template and feature matching, and semantic mapping and recognition; and relative localization, which covers visual-inertial odometry, dead reckoning with filtering and error optimization, and SLAM with visual odometry and optical flow.</desc>
  <defs>
  <marker id="m-flow"  markerWidth="9" markerHeight="9" refX="6.5" refY="3"   orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#21503d"/></marker>
  <marker id="m-share" markerWidth="8" markerHeight="8" refX="5.5" refY="2.6" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 Z" fill="#4d8a6a"/></marker>
  <marker id="m-react" markerWidth="8" markerHeight="8" refX="5.5" refY="2.6" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 Z" fill="#8a978c"/></marker>
  <marker id="m-emerg" markerWidth="9" markerHeight="9" refX="6.5" refY="3"   orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#b6803a"/></marker>
  <marker id="m-sup"   markerWidth="8" markerHeight="8" refX="5.5" refY="2.6" orient="auto"><path d="M0,0 L6,2.6 L0,5.2 Z" fill="#2f6b4f"/></marker>
</defs>
  <style>
  .bg   { fill: #fbfaf6 }
  .nd   { fill: #ffffff; stroke: rgba(22,53,42,0.14); stroke-width: 1 }
  .nd.perc   { fill: #eef4f0 }
  .nd.cog    { fill: #f7f3ec }
  .nd.hw     { fill: #eae2d4 }
  .nd.paper  { fill: #f2ece1 }
  .nd.dark   { fill: #16352a; stroke: #16352a }
  .nd.sup    { fill: #f1ece2; stroke: #4d8a6a; stroke-dasharray: 5 4 }
  .nd.mine   { stroke: #2f6b4f; stroke-width: 1.6 }
  .nd.gold   { fill: #f7efe1; stroke: #b6803a }
  .nd.slate  { fill: #eef2f4; stroke: #4a6b7c }
  .panel     { fill: none; stroke: rgba(22,53,42,0.14); stroke-width: 1; stroke-dasharray: 6 5 }
  .panel.solid { stroke-dasharray: none }
  .band      { stroke: rgba(22,53,42,0.05); stroke-width: 1 }
  .band.delib  { fill: rgba(77,138,106,0.05) }
  .band.react  { fill: rgba(47,107,79,0.045) }
  .band.reflex { fill: rgba(182,128,58,0.055) }
  .ttl  { font-family: Fraunces, Georgia, 'Times New Roman', serif; font-weight: 600; fill: #16352a }
  .lbl  { font-family: Fraunces, Georgia, 'Times New Roman', serif; font-weight: 600; fill: #16352a }
  .lbl.on-dark { fill: #fbfaf6 }
  .sub  { font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #5c6f63 }
  .sub.on-dark { fill: #b9d0c3 }
  .col  { font-family: Fraunces, Georgia, 'Times New Roman', serif; font-weight: 600; fill: #2f6b4f }
  .edge { font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #8a978c }
  .edge.gold  { fill: #b6803a; font-weight: 600 }
  .edge.green { fill: #2f6b4f; font-weight: 600 }
  .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #21503d }
  .flow  { stroke: #21503d; stroke-width: 2.2; fill: none; marker-end: url(#m-flow) }
  .share { stroke: #4d8a6a; stroke-width: 1.6; fill: none; marker-start: url(#m-share); marker-end: url(#m-share) }
  .react { stroke: #8a978c; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; marker-end: url(#m-react) }
  .emerg { stroke: #b6803a; stroke-width: 2.6; fill: none; stroke-dasharray: 7 4; marker-end: url(#m-emerg) }
  .super { stroke: #2f6b4f; stroke-width: 1.4; fill: none; stroke-dasharray: 3 4; opacity: .8; marker-start: url(#m-sup); marker-end: url(#m-sup) }
  .thin  { stroke: #4d8a6a; stroke-width: 1.4; fill: none; marker-end: url(#m-share) }
  .dot   { fill: #2f6b4f }
</style>
  <rect width="1040" height="590" class="bg"/>
  <text x="520" y="34" class="ttl" font-size="22" text-anchor="middle">Outdoor GPS-denied localization, mapped</text>
<path d="M456,278 L372,278" class="thin"/>
<path d="M584,278 L668,278" class="thin"/>
<path d="M256,244 L176,180" class="thin"/><path d="M250,300 L166,332" class="thin"/><path d="M300,346 L316,410" class="thin"/>
<path d="M784,244 L864,180" class="thin"/><path d="M790,300 L874,332" class="thin"/><path d="M740,346 L724,410" class="thin"/>
<circle cx="520" cy="278" r="96" class="nd dark"/><text x="520" y="264.5" class="lbl on-dark" font-size="13" text-anchor="middle">Outdoor</text><text x="520" y="282.4" class="lbl on-dark" font-size="13" text-anchor="middle">GPS-denied UAV</text><text x="520" y="300.4" class="lbl on-dark" font-size="13" text-anchor="middle">localization</text>
<circle cx="300" cy="278" r="78" class="nd gold"/><text x="300" y="273.6" class="lbl" font-size="12.5" text-anchor="middle">Absolute</text><text x="300" y="290.9" class="lbl" font-size="12.5" text-anchor="middle">localization</text>
<circle cx="740" cy="278" r="78" class="nd nd mine"/><text x="740" y="273.6" class="lbl" font-size="12.5" text-anchor="middle">Relative</text><text x="740" y="290.9" class="lbl" font-size="12.5" text-anchor="middle">localization</text>
<circle cx="120" cy="154" r="62" class="nd paper"/><text x="120" y="157.9" class="lbl" font-size="11.5" text-anchor="middle">SatNav</text>
<circle cx="112" cy="356" r="62" class="nd paper"/><text x="112" y="345.1" class="lbl" font-size="10.5" text-anchor="middle">Template &amp;</text><text x="112" y="359.6" class="lbl" font-size="10.5" text-anchor="middle">feature</text><text x="112" y="374.1" class="lbl" font-size="10.5" text-anchor="middle">matching</text>
<circle cx="336" cy="458" r="62" class="nd paper"/><text x="336" y="447.1" class="lbl" font-size="10.5" text-anchor="middle">Semantic</text><text x="336" y="461.6" class="lbl" font-size="10.5" text-anchor="middle">mapping &amp;</text><text x="336" y="476.1" class="lbl" font-size="10.5" text-anchor="middle">recognition</text>
<circle cx="920" cy="154" r="62" class="nd perc"/><text x="920" y="150.3" class="lbl" font-size="10.5" text-anchor="middle">Visual-inertial</text><text x="920" y="164.8" class="lbl" font-size="10.5" text-anchor="middle">odometry</text>
<circle cx="928" cy="356" r="62" class="nd perc"/><text x="928" y="346.6" class="lbl" font-size="9" text-anchor="middle">Dead reckoning,</text><text x="928" y="359.1" class="lbl" font-size="9" text-anchor="middle">filtering &amp;</text><text x="928" y="371.5" class="lbl" font-size="9" text-anchor="middle">error optimization</text>
<circle cx="704" cy="458" r="62" class="nd perc"/><text x="704" y="447.6" class="lbl" font-size="10" text-anchor="middle">SLAM, visual</text><text x="704" y="461.4" class="lbl" font-size="10" text-anchor="middle">odometry &amp;</text><text x="704" y="475.2" class="lbl" font-size="10" text-anchor="middle">optical flow</text>
<text x="300" y="190" class="edge" font-size="9.5" text-anchor="middle">absolute fix, drift-free</text>
<text x="740" y="190" class="edge" font-size="9.5" text-anchor="middle">no fix, but always available</text>
<text x="520" y="562" class="edge" font-size="11.5" text-anchor="middle">The two halves fail in opposite ways — which is the whole argument for fusing them.</text>
</svg>
